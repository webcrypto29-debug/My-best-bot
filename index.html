<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Access Portal</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f8f9fa; margin: 0; padding: 20px; }
        .ad-container { margin: 20px auto; min-height: 100px; display: flex; justify-content: center; align-items: center; }
        .btn-main { padding: 15px 30px; font-size: 18px; color: #fff; background: #007bff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-main:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- TOP AD SPACE -->
    <div id="top-ad-space" class="ad-container"></div>

    <h2>File Download Portal</h2>
    <p>Please click the button below to watch the ad and continue.</p>

    <!-- REWARDED AD BUTTON -->
    <button id="rewarded-btn" class="btn-main" onclick="playRewardedAd()">Loading Ads...</button>

    <!-- BOTTOM AD SPACE -->
    <div id="bottom-ad-space" class="ad-container"></div>

    <script>
        // आपका Termux/Server API URL (Ngrok / Cloudflare Tunnel Link)
        const API_URL = "https://your-termux-domain.trycloudflare.com/api/get-ad-config";

        let currentConfig = {};

        async function loadDynamicAds() {
            try {
                const res = await fetch(API_URL);
                currentConfig = await res.json();

                // 1. TOP AD INJECTION (e.g. A-Ads / Evadav)
                if (currentConfig.header && currentConfig.header.status) {
                    injectAdScript("top-ad-space", currentConfig.header.script_code);
                }

                // 2. BOTTOM AD INJECTION (e.g. AdSterra / Monetag Banner)
                if (currentConfig.footer && currentConfig.footer.status) {
                    injectAdScript("bottom-ad-space", currentConfig.footer.script_code);
                }

                // 3. REWARDED AD SETUP (Monetag / OnClick)
                if (currentConfig.popup && currentConfig.popup.status) {
                    injectScriptTag(currentConfig.popup.script_url);
                    document.getElementById("rewarded-btn").innerText = "Watch Ad & Continue";
                } else {
                    document.getElementById("rewarded-btn").innerText = "Continue to File";
                }

            } catch (err) {
                console.error("Ad Config Fetch Error:", err);
                document.getElementById("rewarded-btn").innerText = "Continue to File";
            }
        }

        function injectAdScript(elementId, scriptHtml) {
            const container = document.getElementById(elementId);
            container.innerHTML = scriptHtml;
            // Execute inner scripts
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        function injectScriptTag(url) {
            if(!url) return;
            const script = document.createElement("script");
            script.src = url;
            script.async = true;
            document.head.appendChild(script);
        }

        function playRewardedAd() {
            const btn = document.getElementById("rewarded-btn");
            btn.disabled = true;

            // अगर Monetag / OnClick का Rewarded Tag Active है
            if (currentConfig.popup && currentConfig.popup.status && typeof show_rewarded === 'function') {
                show_rewarded().then(() => {
                    window.location.href = "step2.html";
                }).catch(() => {
                    window.location.href = "step2.html";
                });
            } else {
                // अगर नो-ऐड है या फेल हो जाए तो टाइमर चलाकर आगे बढ़ाएं
                let count = 5;
                const timer = setInterval(() => {
                    btn.innerText = `Please wait ${count}s...`;
                    count--;
                    if (count < 0) {
                        clearInterval(timer);
                        window.location.href = "step2.html";
                    }
                }, 1000);
            }
        }

        // लोड होते ही बोट से डेटा मंगाएं
        loadDynamicAds();
    </script>
</body>
</html>
