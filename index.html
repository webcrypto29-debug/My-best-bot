<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1 - File Verification</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f8f9fa; }
        .ad-space { margin: 15px auto; min-height: 90px; width: 100%; display: flex; justify-content: center; }
        .btn-main { padding: 15px 30px; font-size: 18px; color: #fff; background: #007bff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- STEP 1 TOP AD -->
    <div id="p1-top-ad" class="ad-space"></div>

    <h2>File Access Portal (Step 1/2)</h2>
    <p>Please click the button below to watch ad and continue.</p>

    <!-- REWARDED AD BUTTON -->
    <button id="action-btn" class="btn-main" onclick="startFlow()">Watch Ad & Continue</button>

    <!-- STEP 1 BOTTOM AD -->
    <div id="p1-bottom-ad" class="ad-space"></div>

<script>
    const API_URL = "https://YOUR_CLOUDFLARE_URL.trycloudflare.com/api/get-ad-config";

    async function loadAds() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();

            // 1. Step 1 Top Ad
            if (data.page1_header && data.page1_header.status && data.page1_header.script_code) {
                injectAd("p1-top-ad", data.page1_header.script_code);
            }

            // 2. Step 1 Bottom Ad
            if (data.page1_footer && data.page1_footer.status && data.page1_footer.script_code) {
                injectAd("p1-bottom-ad", data.page1_footer.script_code);
            }

            // 3. Rewarded Script Tag
            if (data.rewarded && data.rewarded.status && data.rewarded.script_url) {
                const s = document.createElement("script");
                s.src = data.rewarded.script_url;
                document.head.appendChild(s);
            }
        } catch (e) {
            console.log("Error loading ads:", e);
        }
    }

    function injectAd(elementId, html) {
        const div = document.getElementById(elementId);
        div.innerHTML = html;
        Array.from(div.querySelectorAll("script")).forEach(oldScript => {
            const newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    function startFlow() {
        // अगर Rewarded Trigger उपलब्ध है तो चलाएं, नहीं तो टाइमर के साथ आगे जाएं
        if (typeof show_rewarded === 'function') {
            show_rewarded().then(() => window.location.href = "step2.html")
                          .catch(() => window.location.href = "step2.html");
        } else {
            window.location.href = "step2.html";
        }
    }

    loadAds();
</script>
</body>
</html>
