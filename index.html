<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Access Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .ad-space { margin: 15px 0; min-height: 90px; background: #fafafa; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; }
        .btn-action { padding: 14px 28px; font-size: 17px; color: #fff; background: #007bff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-action:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <!-- TOP AD SPACE (Header Ad: A-Ads / Evadav / AdSterra) -->
    <div id="top-ad-space" class="ad-space"><span>[ Header Banner Loading... ]</span></div>

    <h3>🔐 File Access Verification</h3>
    <p>Please click the button below to complete the verification step and unlock your link.</p>

    <!-- REWARDED AD BUTTON -->
    <button id="rewarded-btn" class="btn-action" onclick="handleRewardedAction()">Watch Ad & Continue</button>

    <!-- BOTTOM AD SPACE (Footer Ad) -->
    <div id="bottom-ad-space" class="ad-space"><span>[ Footer Banner Loading... ]</span></div>
</div>

<script>
    // 🔗 यहाँ अपना Termux Ngrok या Cloudflare Tunnel URL डालें
    const TERMUX_API_URL = "YOUR_TERMUX_TUNNEL_URL/api/get-ad-config";

    let currentAdConfig = {};

    async function fetchAdConfig() {
        try {
            const res = await fetch(TERMUX_API_URL);
            currentAdConfig = await res.json();

            // 1. Inject Header Ad
            if (currentAdConfig.header && currentAdConfig.header.status) {
                injectAd("top-ad-space", currentAdConfig.header.script_code);
            }

            // 2. Inject Footer Ad
            if (currentAdConfig.footer && currentAdConfig.footer.status) {
                injectAd("bottom-ad-space", currentAdConfig.footer.script_code);
            }

            // 3. Inject Rewarded Ad SDK (Monetag / OnClick)
            if (currentAdConfig.popup && currentAdConfig.popup.status && currentAdConfig.popup.script_url) {
                loadScript(currentAdConfig.popup.script_url);
            }
        } catch (e) {
            console.warn("Dynamic API connection failed. Running default flow.", e);
        }
    }

    function injectAd(elementId, htmlCode) {
        const el = document.getElementById(elementId);
        if(!htmlCode) return;
        el.innerHTML = htmlCode;
        Array.from(el.querySelectorAll("script")).forEach(oldScript => {
            const newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    function loadScript(url) {
        const script = document.createElement("script");
        script.src = url;
        script.async = true;
        document.head.appendChild(script);
    }

    function handleRewardedAction() {
        const btn = document.getElementById("rewarded-btn");
        btn.disabled = true;

        // Monetag / OnClick Rewarded Trigger Check
        if (typeof show_rewarded === 'function') {
            show_rewarded().then(() => {
                window.location.href = "step2.html";
            }).catch(() => {
                window.location.href = "step2.html";
            });
        } else {
            let timer = 5;
            const interval = setInterval(() => {
                btn.innerText = `Please wait ${timer}s...`;
                timer--;
                if (timer < 0) {
                    clearInterval(interval);
                    window.location.href = "step2.html";
                }
            }, 1000);
        }
    }

    // Load dynamic settings on open
    fetchAdConfig();
</script>

</body>
</html>
