<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2 - Download Ready</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f8f9fa; }
        .ad-space { margin: 15px auto; min-height: 90px; width: 100%; display: flex; justify-content: center; }
        .btn-green { padding: 15px 30px; font-size: 18px; color: #fff; background: #28a745; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

    <!-- STEP 2 TOP AD -->
    <div id="p2-top-ad" class="ad-space"></div>

    <h2>🎉 Your File is Ready! (Step 2/2)</h2>
    <p>Click below to get your direct file.</p>

    <!-- GET LINK BUTTON -->
    <a id="file-btn" href="#" class="btn-green">🚀 Get Link</a>

    <!-- STEP 2 BOTTOM AD -->
    <div id="p2-bottom-ad" class="ad-space"></div>

<script>
    const API_URL = "https://YOUR_CLOUDFLARE_URL.trycloudflare.com/api/get-ad-config";

    async function loadAds() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();

            // 1. Step 2 Top Ad
            if (data.page2_header && data.page2_header.status && data.page2_header.script_code) {
                injectAd("p2-top-ad", data.page2_header.script_code);
            }

            // 2. Step 2 Bottom Ad
            if (data.page2_footer && data.page2_footer.status && data.page2_footer.script_code) {
                injectAd("p2-bottom-ad", data.page2_footer.script_code);
            }
        } catch (e) {
            console.log("Error loading ads:", e);
        }
    }

    function injectAd(elementId, html) {
        const div = document.getElementById(elementId);
        div.innerHTML = html;
        Array.from(div.querySelectorAll("script")).forEach(oldScript => {
            const newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    loadAds();
</script>
</body>
</html>
